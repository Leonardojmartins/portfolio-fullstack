<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Leonardo Martins</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <main class="cadastro-container">
        <section class="cadastro-card">

            <h1>Cadastro</h1>
            <p>Preencha seus dados para entrar em contato.</p>

            <form id="form-cadastro">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                    >
                </div>

                <div class="campo">
                    <label for="assunto">Assunto</label>
                    <input
                        type="text"
                        id="assunto"
                        name="assunto"
                    >
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="5"
                        required
                    ></textarea>
                </div>

                <button type="submit">
                    Cadastrar
                </button>

                <p id="mensagem-status"></p>

            </form>

            <a href="index.html">Voltar para o início</a>

        </section>
    </main>

        <script src="cadastro.js"></script>
</body>
</html>
