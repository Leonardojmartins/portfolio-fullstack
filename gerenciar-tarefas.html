
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gerenciar Tarefas | Leonardo Martins</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <main class="gerenciamento-container">

        <section class="gerenciamento-card">

            <header class="gerenciamento-topo">
                <div>
                    <h1>Gerenciamento de Tarefas</h1>
                    <p>
                        Cadastre, consulte, edite e exclua
                        tarefas vinculadas aos seus projetos.
                    </p>
                </div>

                <a href="index.html" class="voltar-inicio">
                    Voltar ao início
                </a>
            </header>

            <!-- FORMULÁRIO DE TAREFAS -->

            <section class="projeto-formulario">

                <h2 id="titulo-formulario">
                    Cadastrar nova tarefa
                </h2>

                <form id="form-tarefa">

                    <input type="hidden" id="tarefa-id">

                    <div class="campo">
                        <label for="projeto-tarefa">
                            Projeto relacionado *
                        </label>

                        <select id="projeto-tarefa" required>
                            <option value="">
                                Selecione um projeto
                            </option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="titulo-tarefa">
                            Título da tarefa *
                        </label>

                        <input
                            type="text"
                            id="titulo-tarefa"
                            placeholder="Ex.: Criar página inicial"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="descricao-tarefa">
                            Descrição
                        </label>

                        <textarea
                            id="descricao-tarefa"
                            rows="4"
                            placeholder="Descreva a atividade..."
                        ></textarea>
                    </div>

                    <div class="campo">
                        <label for="prazo-tarefa">
                            Prazo
                        </label>

                        <input
                            type="date"
                            id="prazo-tarefa"
                        >
                    </div>

                    <div class="campo">
                        <label for="status-tarefa">
                            Status
                        </label>

                        <select id="status-tarefa">
                            <option value="Pendente">
                                Pendente
                            </option>

                            <option value="Em andamento">
                                Em andamento
                            </option>

                            <option value="Concluída">
                                Concluída
                            </option>
                        </select>
                    </div>

                    <div class="acoes-formulario">

                        <button type="submit" id="btn-salvar">
                            Cadastrar tarefa
                        </button>

                        <button
                            type="button"
                            id="btn-cancelar"
                            hidden
                        >
                            Cancelar edição
                        </button>

                    </div>

                    <p id="mensagem-tarefa"
                       role="status"
                       aria-live="polite"></p>

                </form>

            </section>

            <!-- LISTAGEM DE TAREFAS -->

            <section class="projetos-cadastrados">

                <h2>Tarefas cadastradas</h2>

                <p id="status-listagem"
                   role="status"
                   aria-live="polite">
                    Aguardando carregamento...
                </p>

                <div id="lista-tarefas"
                     class="lista-projetos">
                </div>

            </section>

        </section>

    </main>

    <script src="gerenciar-tarefas.js"></script>

</body>
</html>
